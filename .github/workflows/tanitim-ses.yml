name: Tanıtım videosu sesleri
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "tanitim/script2.json", "tanitim/tts2.py", "tanitim/oryantasyon.json", "tanitim/tts_or.py" ]
permissions:
  contents: write
jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install edge-tts
      - run: python3 tanitim/tts2.py
      - run: python3 tanitim/tts_or.py
      - name: Sesleri depoya yaz
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tanitim/audio2 tanitim/audio3
          git diff --cached --quiet || (git commit -m "Tanıtım videosu sesleri (yapay zekâ)" && git push)
