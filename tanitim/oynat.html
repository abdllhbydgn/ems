<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMS Tanıtım Videosu</title>
<style>body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif}.w{max-width:1100px;margin:0 auto;padding:10px}.st{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}video{position:absolute;inset:0;width:100%;height:100%}#l{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 8px}#l button{border:0;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;color:#fff;background:#334155}#l button.on{background:#E11D2E}.c{position:absolute;left:3%;right:3%;bottom:54px;text-align:center;pointer-events:none;z-index:2}.c div{margin-top:4px}.c span{display:inline-block;background:rgba(8,12,24,.84);padding:5px 12px;border-radius:9px;font-weight:600;line-height:1.4;font-size:clamp(10px,1.6vw,17px)}h1{font-size:17px;margin:4px 0 8px;text-align:center}@media(max-width:700px){.w{padding:0}.st{border-radius:0}}</style></head><body><div class="w"><h1>EMS Portal Tanıtımı · Introduction · تعريف بالبوابة</h1>
<div id="l"></div><div class="st"><video id="v" controls playsinline muted preload="auto" src="EMS_Tanitim_video.mp4"></video><audio id="a" preload="auto"></audio><div class="c" id="c"></div></div></div>
<script>
const v=document.getElementById('v'),a=document.getElementById('a'),cap=document.getElementById('c'),lb=document.getElementById('l');let L='tr',tl,sc,last=-1;
const OTHER={tr:['ar','en'],en:['ar','tr'],ar:['en','tr']},LBL={tr:'TR · Türkçe',en:'EN · English',ar:'AR · العربية'};
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function show(){if(!tl||!sc)return;let i=0;for(let k=0;k<tl.starts.length;k++)if(v.currentTime>=tl.starts[k])i=k;if(i===last)return;last=i;cap.innerHTML=OTHER[L].map(l=>'<div dir="'+(l==='ar'?'rtl':'ltr')+'"><span>'+esc((sc[i]||{})[l]||'')+'</span></div>').join('')}
function set(l){L=l;const keep=!v.paused;a.src='ems_tanitim_'+l+'.m4a';try{a.currentTime=v.currentTime}catch(e){}if(keep)a.play().catch(()=>{});lb.innerHTML=['tr','en','ar'].map(x=>'<button data-l="'+x+'" class="'+(x===l?'on':'')+'">'+LBL[x]+'</button>').join('');lb.querySelectorAll('button').forEach(b=>b.onclick=()=>set(b.dataset.l));last=-1;show()}
const sync=()=>{if(Math.abs(a.currentTime-v.currentTime)>0.6){try{a.currentTime=v.currentTime}catch(e){}}};
v.addEventListener('play',()=>{try{a.currentTime=v.currentTime}catch(e){}a.play().catch(()=>{})});v.addEventListener('pause',()=>a.pause());v.addEventListener('seeking',()=>{try{a.currentTime=v.currentTime}catch(e){}});v.addEventListener('waiting',()=>a.pause());v.addEventListener('playing',()=>{sync();if(a.paused)a.play().catch(()=>{})});v.addEventListener('timeupdate',()=>{sync();show()});v.addEventListener('ended',()=>a.pause());
Promise.all([fetch('timeline.json').then(r=>r.json()),fetch('script.json').then(r=>r.json())]).then(r=>{tl=r[0];sc=r[1];show()});set('tr');
</script></body></html>
