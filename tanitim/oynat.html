<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMS Tanıtım Videosu</title>
<style>body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif}.w{max-width:1100px;margin:0 auto;padding:12px}.st{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}video{position:absolute;inset:0;width:100%;height:100%}.l{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:3}.l button{border:0;border-radius:8px;padding:8px 13px;font-weight:800;cursor:pointer;color:#fff;background:rgba(15,23,42,.8)}.l button.on{background:#E11D2E}.c{position:absolute;left:4%;right:4%;bottom:56px;text-align:center;pointer-events:none;z-index:2}.c span{display:inline-block;background:rgba(8,12,24,.82);padding:7px 14px;border-radius:10px;font-weight:600;line-height:1.45;font-size:clamp(11px,1.9vw,19px)}h1{font-size:18px;margin:6px 0 10px}</style></head><body><div class="w"><h1>EMS Portal Tanıtımı · Introduction · تعريف بالبوابة</h1>
<div class="st"><video id="v" controls playsinline muted preload="auto" src="EMS_Tanitim_video.mp4"></video><audio id="a" preload="auto"></audio><div class="l" id="l"></div><div class="c" id="cw"><span id="c"></span></div></div></div>
<script>
const v=document.getElementById('v'),a=document.getElementById('a'),cap=document.getElementById('c'),lb=document.getElementById('l');let L='tr',tl,sc,last=-1;
function show(){if(!tl||!sc)return;let i=0;for(let k=0;k<tl.starts.length;k++)if(v.currentTime>=tl.starts[k])i=k;if(i===last)return;last=i;cap.textContent=(sc[i]||{})[L]||''}
function set(l){L=l;const keep=!v.paused;a.src='ems_tanitim_'+l+'.m4a';a.currentTime=v.currentTime;if(keep)a.play().catch(()=>{});lb.innerHTML=[['tr','TR'],['en','EN'],['ar','AR']].map(x=>'<button data-l="'+x[0]+'" class="'+(x[0]===l?'on':'')+'">'+x[1]+'</button>').join('');lb.querySelectorAll('button').forEach(b=>b.onclick=()=>set(b.dataset.l));document.getElementById('cw').style.direction=l==='ar'?'rtl':'ltr';last=-1;show()}
const sync=()=>{if(Math.abs(a.currentTime-v.currentTime)>0.35){try{a.currentTime=v.currentTime}catch(e){}}};
v.addEventListener('play',()=>{a.currentTime=v.currentTime;a.play().catch(()=>{})});v.addEventListener('pause',()=>a.pause());v.addEventListener('seeking',()=>{try{a.currentTime=v.currentTime}catch(e){}});v.addEventListener('waiting',()=>a.pause());v.addEventListener('playing',()=>{sync();if(a.paused)a.play().catch(()=>{})});v.addEventListener('timeupdate',()=>{sync();show()});v.addEventListener('ended',()=>a.pause());
Promise.all([fetch('timeline.json').then(r=>r.json()),fetch('script.json').then(r=>r.json())]).then(r=>{tl=r[0];sc=r[1];show()});set('tr');
</script></body></html>
